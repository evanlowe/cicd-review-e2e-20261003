# AgentKit Studio automation 2a0f3b419371b3a92909663bcf5b829e32cdd35db91138732c9d6ffcb64bb04b
name: PR review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agentkit-2a0f3b419371b3a92909663b-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Review through Sandbox
        env:
          RUNNER_ENDPOINT: ${{ secrets.AGENTKIT_2A0F3B419371B3A92909663B_ENDPOINT }}
          RUNNER_API_KEY: ${{ secrets.AGENTKIT_2A0F3B419371B3A92909663B_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          # Copyright (c) 2026 ByteDance Ltd. and/or its affiliates
          #
          # Licensed under the Apache License, Version 2.0 (the "License");
          # you may not use this file except in compliance with the License.
          # You may obtain a copy of the License at
          #
          #     http://www.apache.org/licenses/LICENSE-2.0
          #
          # Unless required by applicable law or agreed to in writing, software
          # distributed under the License is distributed on an "AS IS" BASIS,
          # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
          # See the License for the specific language governing permissions and
          # limitations under the License.
          """Standalone Actions client, embedded with trusted worker code at setup"""

          import json
          import os
          import re
          import secrets
          import shlex
          import sys
          import time
          from typing import cast
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit, urlunsplit
          from urllib.request import (
              HTTPRedirectHandler,
              ProxyHandler,
              Request,
              build_opener,
          )

          WORKER_BUNDLE = ""
          JOB_SOURCE = ""
          REQUEST_SECONDS = 30


          class RunnerError(Exception):
              """Controlled diagnostics without credentials or upstream response bodies"""


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(
                  self,
                  req: Request,
                  fp: object,
                  code: int,
                  msg: str,
                  headers: object,
                  newurl: str,
              ) -> None:
                  return None


          def json_object(value: object) -> dict[str, object]:
              if not isinstance(value, dict):
                  raise RunnerError("Runner returned an invalid JSON object")
              return cast(dict[str, object], value)


          def review_config(environment: dict[str, str]) -> dict[str, object]:
              repository = environment["REPOSITORY"]
              head = environment["HEAD_SHA"]
              number = int(environment["PULL_NUMBER"])
              if not re.fullmatch(r"[\w.-]+/[\w.-]+", repository) or number <= 0:
                  raise RunnerError("Invalid PR identity")
              if not re.fullmatch(r"[0-9a-f]{40}", head):
                  raise RunnerError("Invalid PR commit")
              api_url = environment["GITHUB_API_URL"].rstrip("/")
              if urlsplit(api_url).scheme != "https":
                  raise RunnerError("GitHub API must use HTTPS")
              return {
                  "request": {
                      "repository": repository,
                      "pull_number": number,
                      "head_sha": head,
                      "github_token": environment["GITHUB_TOKEN"],
                  },
                  "github_api_url": api_url,
                  "model_backend": "cli",
              }


          def shell_request(
              environment: dict[str, str], payload: dict[str, object]
          ) -> dict[str, object]:
              endpoint = urlsplit(environment["RUNNER_ENDPOINT"])
              if (
                  endpoint.scheme != "https"
                  or not endpoint.hostname
                  or endpoint.username
                  or endpoint.fragment
              ):
                  raise RunnerError("Configure an HTTPS Session endpoint secret")
              key = environment["RUNNER_API_KEY"]
              if not key:
                  raise RunnerError("Configure the Sandbox Tool key secret")
              url = urlunsplit(
                  (endpoint.scheme, endpoint.netloc, "/v1/shell/exec", endpoint.query, "")
              )
              program = (
                  f"import base64;exec(compile(base64.b64decode({JOB_SOURCE!r}),"
                  "'<review-job>','exec'))"
              )
              command = (
                  f"python3 -I -c {shlex.quote(program)} <<'REVIEW_INPUT'\n"
                  f"{json.dumps(payload)}\nREVIEW_INPUT"
              )
              request = Request(
                  url,
                  data=json.dumps(
                      {
                          "id": "",
                          "exec_dir": "/tmp",
                          "command": command,
                          "timeout": REQUEST_SECONDS,
                          "hard_timeout": REQUEST_SECONDS + 10,
                          "strict": True,
                          "truncate": False,
                      }
                  ).encode(),
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                  },
              )
              with build_opener(ProxyHandler({}), NoRedirect()).open(
                  request, timeout=REQUEST_SECONDS + 20
              ) as response:
                  data = json_object(json_object(json.loads(response.read())).get("data"))
              if (
                  data.get("status") != "completed"
                  or type(data.get("exit_code")) is not int
                  or data.get("exit_code") != 0
              ):
                  raise RunnerError(
                      "Runner command did not complete; check the PR before rerunning"
                  )
              output = data.get("output")
              if not isinstance(output, str):
                  raise RunnerError("Runner did not return command output")
              return json_object(json.loads(output))


          def parse_review_result(result: object, head: str) -> dict[str, object]:
              result = json_object(result)
              fields = {
                  "head_sha",
                  "review_id",
                  "reviewed_files",
                  "skipped_files",
                  "findings",
              }
              if set(result) != fields or result["head_sha"] != head:
                  raise RunnerError("Review result does not match this commit")
              for key in fields - {"head_sha"}:
                  value = result[key]
                  if type(value) is not int or value < (1 if key == "review_id" else 0):
                      raise RunnerError("Review returned invalid result counts")
              return result


          def invoke_runner(environment: dict[str, str]) -> dict[str, object]:
              run_id = secrets.token_hex(32)
              payload: dict[str, object] = {
                  "action": "start",
                  "run_id": run_id,
                  "bundle": WORKER_BUNDLE,
                  "config": review_config(environment),
              }
              try:
                  status = shell_request(environment, payload)
              except (OSError, URLError) as error:
                  if isinstance(error, HTTPError) and 400 <= error.code < 500:
                      raise
                  # 启动响应丢失时只查询同一任务，不能重复启动可能已经写入的评审
                  status = {"status": "starting"}
              errors = 0
              while status.get("status") in {"running", "starting"}:
                  time.sleep(10)
                  try:
                      status = shell_request(
                          environment, {"action": "status", "run_id": run_id}
                      )
                      errors = 0
                  except (OSError, URLError) as error:
                      if isinstance(error, HTTPError) and 400 <= error.code < 500:
                          raise
                      errors += 1
                      if errors >= 3:
                          raise RunnerError(
                              "Runner status could not be confirmed; "
                              "check the PR before rerunning"
                          ) from None
              if status.get("status") != "completed":
                  message = status.get("error", "Review did not complete")
                  if not isinstance(message, str):
                      message = "Review did not complete"
                  for name in ("GITHUB_TOKEN", "RUNNER_ENDPOINT", "RUNNER_API_KEY"):
                      secret = environment.get(name)
                      if secret:
                          message = message.replace(secret, "[redacted]")
                  raise RunnerError(message)
              result = parse_review_result(status.get("result"), environment["HEAD_SHA"])
              try:
                  shell_request(environment, {"action": "cleanup", "run_id": run_id})
              except Exception:
                  # 已核对的评审结果不因后续临时目录清理失败而变成失败
                  print(
                      "Review completed; temporary state cleanup failed", file=sys.stderr
                  )
              return result


          def main() -> None:
              try:
                  result = invoke_runner(dict(os.environ))
                  print(json.dumps(result))
                  if result["skipped_files"]:
                      raise RunnerError("Partial review; see the PR review")
              except HTTPError as error:
                  sys.exit(
                      f"Runner HTTP {error.code}; check Session availability and secrets"
                  )
              except RunnerError as error:
                  sys.exit(str(error))
              except Exception as error:
                  sys.exit(
                      f"Runner {type(error).__name__}; outcome may be unknown, "
                      "check the PR before rerunning"
                  )


          if __name__ == "__main__":
              main()
          PY
